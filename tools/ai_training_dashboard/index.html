<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09110f">
  <title>PTCG Deep AI 训练</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2309100f'/%3E%3Cpath d='M12 34h9l5-13 9 28 6-15h11' fill='none' stroke='%2353e0a5' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <p class="eyebrow">LOCAL · DEEP AI LAB</p>
      <h1>自主学习训练台</h1>
      <p id="connection" class="connection muted" aria-live="polite">正在连接本机训练服务…</p>
    </div>
    <div class="create" aria-label="创建训练任务">
      <label>Smoke 牌组
        <select id="smoke-deck">
          <option value="fire">火</option>
          <option value="water">水</option>
          <option value="psychic">超能</option>
          <option value="lightning">雷</option>
          <option value="fighting">斗</option>
          <option value="colorless">无色</option>
          <option value="dragon">龙</option>
          <option value="grass">草</option>
          <option value="steel">钢</option>
          <option value="darkness">恶</option>
        </select>
      </label>
      <button id="create-smoke" class="secondary">链路 Smoke</button>
      <button id="create-pilot" class="secondary">工程 Pilot</button>
      <button id="create-release">开始 Release</button>
    </div>
  </header>

  <main>
    <aside class="runs-panel panel">
      <div class="panel-title">
        <h2>训练记录</h2>
        <button id="refresh" class="ghost">刷新</button>
      </div>
      <div id="runs" class="runs" aria-live="polite"></div>
    </aside>

    <section class="workspace">
      <div id="empty" class="panel empty">
        <p>选择一条训练记录查看实时状态。</p>
      </div>
      <div id="detail" hidden>
        <section class="hero panel">
          <div class="hero-copy">
            <p id="run-meta" class="eyebrow"></p>
            <h2 id="run-title"></h2>
            <p id="run-message" class="muted" aria-live="polite"></p>
          </div>
          <div class="controls" aria-label="训练控制">
            <button id="pause" class="secondary">暂停</button>
            <button id="resume" class="secondary">恢复</button>
            <button id="cancel" class="danger">取消</button>
          </div>
          <div
            id="progress-track"
            class="progress-track"
            role="progressbar"
            aria-label="当前阶段进度"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          ><div id="progress-bar"></div></div>
          <div class="progress-copy">
            <strong id="progress-label">0 / 0</strong>
            <span id="eta">本阶段 ETA —</span>
          </div>
        </section>

        <section class="metrics-grid">
          <article class="metric panel"><span>Learner 吞吐</span><strong id="speed">—</strong></article>
          <article class="metric panel"><span>平均推理批次</span><strong id="gpu">—</strong></article>
          <article class="metric panel"><span>Loader / Learner</span><strong id="vram">—</strong></article>
          <article class="metric panel"><span>回放池</span><strong id="replay">—</strong></article>
          <article class="metric panel"><span>周期 / Global step</span><strong id="history">—</strong></article>
          <article class="metric panel"><span>Policy loss</span><strong id="policy-loss">—</strong></article>
          <article class="metric panel"><span>WDL loss</span><strong id="value-loss">—</strong></article>
          <article class="metric panel"><span>归一化策略熵</span><strong id="choice-loss">—</strong></article>
          <article class="metric panel"><span>Arena 胜 / 负 / 平</span><strong id="record">—</strong></article>
        </section>

        <section class="panel">
          <div class="panel-title"><h2>实时事件与错误</h2><span id="last-seq" class="muted">seq 0</span></div>
          <div id="events" class="event-log" aria-live="polite"></div>
        </section>
      </div>
    </section>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
