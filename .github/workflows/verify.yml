name: verify

env:
  CI_PYTHON_VERSION: '3.11.9'

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  fast:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.CI_PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install product authoring dependencies
        shell: pwsh
        run: python -m pip install -r .\python\requirements.txt "scons==4.10.1"

      - name: Install pinned Godot toolchain
        shell: pwsh
        run: .\tools\setup_godot_toolchain.ps1

      - name: Run fast verification
        shell: pwsh
        run: .\tools\test_fast.ps1 -Python python

      - name: Run fixed-seed Challenge matches
        shell: pwsh
        run: .\tools\test_godot_ai.ps1

  standard:
    needs: fast
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.CI_PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install product authoring dependencies
        shell: pwsh
        run: python -m pip install -r .\python\requirements.txt "scons==4.10.1"

      - name: Install pinned Godot toolchain
        shell: pwsh
        run: .\tools\setup_godot_toolchain.ps1

      - name: Run Python, Godot UI, LAN and Relay contracts
        shell: pwsh
        run: .\tools\test_standard.ps1 -Python python

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: standard
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.CI_PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install product build dependencies
        shell: pwsh
        run: python -m pip install -r .\python\requirements.txt "scons==4.10.1"

      - name: Install pinned product toolchains
        shell: pwsh
        run: |
          .\tools\setup_godot_toolchain.ps1 -IncludeAndroid
          .\tools\setup_native_ai_deps.ps1

      - name: Build and package test-signed release
        shell: pwsh
        run: .\tools\package_release.ps1 -AndroidSigning test

      - name: Verify Windows and Android artifacts
        shell: pwsh
        run: .\tools\test_release.ps1
