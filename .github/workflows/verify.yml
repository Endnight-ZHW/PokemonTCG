name: verify

on:
  push:
  pull_request:
  schedule:
    - cron: '20 18 * * *'
  workflow_dispatch:

jobs:
  fast:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install Python runtime dependencies
        shell: pwsh
        run: python -m pip install -r .\python\requirements.txt

      - name: Install pinned Godot toolchain
        shell: pwsh
        run: .\tools\setup_godot_toolchain.ps1

      - name: Run fast verification
        shell: pwsh
        run: .\tools\test_fast.ps1 -Python python

      - name: Run Challenge AI smoke suite
        shell: pwsh
        run: .\tools\test_godot_ai.ps1

      - name: Run Challenge AI evaluator smoke
        shell: pwsh
        run: .\tools\evaluate_godot_ai.ps1 -EvalPreset Smoke -NoProgress -OutputDir .test_tmp\ci-ai-smoke

  legacy-model-contract:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'

      - name: Verify legacy model metadata and artifact integrity
        shell: pwsh
        working-directory: python
        run: |
          $env:PYTHONNOUSERSITE = '1'
          python -B -m unittest -q tests.test_release_manifest

  nightly-ai:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: [fast, legacy-model-contract]
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: '3.11.15'
          auto-activate-base: false

      - name: Install pinned toolchains
        shell: pwsh
        run: |
          .\tools\setup_godot_toolchain.ps1
          .\tools\setup_ai_toolchain.ps1
          .\tools\setup_android_toolchain.ps1
          .\tools\setup_native_ai_deps.ps1

      - name: Run full rules, Godot, and network verification
        shell: pwsh
        run: .\tools\test_standard.ps1 -Python .\.tools\python311\python.exe

      - name: Rebuild native runtimes and package test-signed release
        shell: pwsh
        run: .\tools\package_release.ps1 -AndroidSigning test

      - name: Run Challenge AI and disabled-Deep fallback regression
        shell: pwsh
        run: .\tools\test_godot_ai.ps1

      - name: Verify Windows and Android release artifacts
        shell: pwsh
        run: .\tools\test_release.ps1

  nightly-ai-evaluation:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: [fast]
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install Python runtime dependencies
        shell: pwsh
        run: python -m pip install -r .\python\requirements.txt

      - name: Install pinned Godot toolchain
        shell: pwsh
        run: .\tools\setup_godot_toolchain.ps1

      - name: Run 2,800-game matrix plus 60-game search-depth probe
        shell: pwsh
        run: .\tools\evaluate_godot_ai.ps1 -EvalPreset Nightly -Workers 2 -ProgressEveryPairs 25 -OutputDir .test_tmp\ai-eval-nightly

      - name: Upload traditional AI evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traditional-ai-nightly-${{ github.run_id }}
          path: .test_tmp/ai-eval-nightly/
          if-no-files-found: warn
