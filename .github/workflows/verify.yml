name: verify

on:
  push:
  pull_request:
  schedule:
    - cron: '20 18 * * *'
  workflow_dispatch:

jobs:
  fast:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install Python runtime dependencies
        shell: pwsh
        run: python -m pip install -r .\python\requirements.txt

      - name: Install pinned Godot toolchain
        shell: pwsh
        run: .\tools\setup_godot_toolchain.ps1

      - name: Run fast verification
        shell: pwsh
        run: .\tools\test_fast.ps1 -Python python

  onnx-parity:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
          cache: pip
          cache-dependency-path: tools/toolchain.lock.json

      - name: Install locked ONNX exporter
        shell: pwsh
        run: |
          python -m pip install numpy==1.26.4 onnx==1.22.0 onnxruntime==1.26.0
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Verify committed ONNX bundle
        shell: pwsh
        run: |
          $env:PYTHONNOUSERSITE = '1'
          python -B .\python\scripts\export_onnx_models.py --check

  nightly-ai:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: [fast, onnx-parity]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchains
        shell: pwsh
        run: .\tools\setup_godot_toolchain.ps1

      - name: Run native Deep AI regression
        shell: pwsh
        run: .\tools\test_godot_ai.ps1 -RequireDeepRuntime
