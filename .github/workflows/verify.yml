name: verify

env:
  # CPython 3.11.10+ security releases in actions/python-versions do not ship
  # Windows archives. Keep product CI on the final Windows-installable patch;
  # the independent Conda-based Deep AI research toolchain remains on 3.11.15.
  CI_PYTHON_VERSION: '3.11.9'

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  challenge-arena:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.CI_PYTHON_VERSION }}

      - name: Install Arena build dependencies
        shell: pwsh
        run: python -m pip install "pybind11==2.13.6" "scons==4.10.1"

      - name: Install pinned native headers
        shell: pwsh
        run: .\tools\setup_relay_deps.ps1

      - name: Build and run the cross-version structural smoke
        shell: pwsh
        run: |
          .\research\deep_ai\tools\run_challenge_arena.ps1 `
            -Preset smoke `
            -Workers 4 `
            -AllowSelfPlay `
            -Output build\challenge-arena\ci-smoke

      - name: Verify cross-version evidence
        shell: pwsh
        run: |
          $manifest = Get-Content `
            build\challenge-arena\ci-smoke\arena-manifest.json `
            -Raw | ConvertFrom-Json
          $summary = Get-Content `
            build\challenge-arena\ci-smoke\arena-summary.json `
            -Raw | ConvertFrom-Json
          if (
            [string]$manifest.candidate.backend -ne 'external_process' -or
            [string]$manifest.baseline.backend -ne 'external_process' -or
            [string]$manifest.baseline.binary.git_ref -ne 'd4f20ee9775b7e8c80a1994e5c9aa5f1e11c9864' -or
            [int]$summary.integrity.structural_errors -ne 0 -or
            [int]$summary.integrity.truncated_games -ne 0
          ) {
            throw 'Native Challenge Arena smoke evidence is invalid.'
          }

      - name: Run all Native Challenge Arena tests
        shell: pwsh
        run: |
          $env:PYTHONNOUSERSITE = '1'
          $env:PYTHONPATH = @(
            "$PWD\research\deep_ai\build\native",
            "$PWD\research\deep_ai\python",
            "$PWD\research\deep_ai"
          ) -join [IO.Path]::PathSeparator
          Push-Location research\deep_ai
          python -B -m unittest -q `
            tests.test_challenge_arena_tasks `
            tests.test_challenge_arena_stats `
            tests.test_challenge_arena_build `
            tests.test_challenge_arena_store `
            tests.test_challenge_arena_determinism `
            tests.test_challenge_agent_protocol
          $arenaTestExitCode = $LASTEXITCODE
          Pop-Location
          if ($arenaTestExitCode -ne 0) {
            throw 'Native Challenge Arena tests failed.'
          }

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-challenge-arena-smoke
          path: build/challenge-arena/ci-smoke

  fast:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.CI_PYTHON_VERSION }}

      - name: Install product build dependency
        shell: pwsh
        run: python -m pip install "scons==4.10.1"

      - name: Install pinned native and Godot toolchains
        shell: pwsh
        run: |
          .\tools\setup_native_ai_deps.ps1
          .\tools\setup_godot_toolchain.ps1 -SkipExportTemplates

      - name: Run fast verification
        shell: pwsh
        run: .\tools\test_fast.ps1

      - name: Package Windows Relay
        shell: pwsh
        run: .\tools\package_relay.ps1

      - uses: actions/upload-artifact@v6
        with:
          name: relay-windows-x86_64
          path: dist/relay/*.zip

      - name: Run fixed-seed Challenge matches
        shell: pwsh
        run: .\tools\test_godot_ai.ps1

  standard:
    needs: fast
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.CI_PYTHON_VERSION }}

      - name: Install product build dependency
        shell: pwsh
        run: python -m pip install "scons==4.10.1"

      - name: Install pinned native and Godot toolchains
        shell: pwsh
        run: |
          .\tools\setup_native_ai_deps.ps1
          .\tools\setup_godot_toolchain.ps1 -SkipExportTemplates

      - name: Run authoring, Godot UI, LAN and Relay contracts
        shell: pwsh
        run: .\tools\test_standard.ps1

  relay-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.CI_PYTHON_VERSION }}

      - name: Install SCons
        run: python -m pip install "scons==4.10.1"

      - name: Test and package Linux Relay
        shell: pwsh
        run: |
          ./tools/setup_relay_deps.ps1
          ./tools/test_relay.ps1
          ./tools/package_relay.ps1

      - uses: actions/upload-artifact@v6
        with:
          name: relay-linux-x86_64
          path: dist/relay/*.tar.gz

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: [standard, relay-linux]
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.CI_PYTHON_VERSION }}

      - name: Install product build dependencies
        shell: pwsh
        run: python -m pip install "scons==4.10.1"

      - name: Install pinned product toolchains
        shell: pwsh
        run: |
          .\tools\setup_godot_toolchain.ps1 -IncludeAndroid
          .\tools\setup_native_ai_deps.ps1

      - name: Build and package test-signed release
        shell: pwsh
        run: |
          .\tools\package_release.ps1 -AndroidSigning test
          .\tools\package_relay.ps1

      - name: Verify Windows and Android artifacts
        shell: pwsh
        run: .\tools\test_release.ps1
