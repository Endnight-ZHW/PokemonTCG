name: deep-ai-research-manual

on:
  workflow_dispatch:

jobs:
  research-smoke:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: research/deep_ai/requirements-ai-gpu.lock.txt

      - name: Install CPU research smoke dependencies
        shell: pwsh
        run: >-
          python -m pip install
          torch==2.4.1
          numpy==1.26.4
          onnx==1.22.0
          onnxruntime==1.26.0
          safetensors==0.4.5
          pybind11==2.13.6
          scons==4.10.1

      - name: Build shared binding and run the research smoke workflow
        shell: pwsh
        run: .\research\deep_ai\tools\test_research_smoke.ps1 -Python python
